name: Bug report
description: Report a reproducible problem with synthetic data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, database connection strings, or real customer data. Report vulnerabilities privately through Security.
  - type: input
    id: revision
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include your environment and use synthetic data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
