services:
  gateway:
    image: caddy:2.11.9-alpine
    environment:
      CANOPY_DOMAIN: "${CANOPY_DOMAIN:?Set the public HTTPS hostname}"
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-data:/data
      - gateway-config:/config
    networks:
      app:
        ipv4_address: 172.30.116.2
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: canopy-backend:${CANOPY_RELEASE:?Set the release identifier}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: ./backend/.env
    environment:
      ENVIRONMENT: production
      ALLOWED_ORIGINS: '["https://${CANOPY_DOMAIN:?Set the public HTTPS hostname}"]'
      FORWARDED_ALLOW_IPS: "172.30.116.2"
    secrets:
      - supabase-ca.crt
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=8).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 105s
    restart: unless-stopped

  web:
    image: canopy-web:${CANOPY_RELEASE:?Set the release identifier}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.116.0/28

secrets:
  supabase-ca.crt:
    file: "${CANOPY_SUPABASE_CA_FILE:?Set the trusted Supabase CA file path}"

volumes:
  gateway-data:
  gateway-config:
